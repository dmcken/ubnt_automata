name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 dropped: GitHub's hosted runners no longer have an x64
        # build of it available ("Version 3.9 with arch x64 not found"
        # from actions/setup-python), confirmed unrelated to any code
        # change here - it was already broken on main before this.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests-mock
        pip install -e .
    - name: Run tests
      run: |
        pytest
